name: Support a new data source
description: Suggest a site, tool or connector the teardown should read from
labels: ["data-source"]
body:
  - type: input
    id: source
    attributes:
      label: Site, tool or service
      placeholder: "e.g. TrustRadius, Similarweb, Product Hunt, LinkedIn jobs"
    validations:
      required: true
  - type: input
    id: access
    attributes:
      label: How Claude can reach it
      placeholder: "public page, MCP server name/link, API, export file, screenshots"
  - type: textarea
    id: value
    attributes:
      label: What it would add
      description: Which lenses or matrix rows it would make better, and what to read from it.
