<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Competitor teardown: demo report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:wght@600;800&family=Sofia+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE work: a competitor teardown read by product, marketing and sales, dense and calm
   IDEA an annual-report spread: the gap as headline, one vermilion mass marks "us" and where we trail
   PICTURE comparison matrix with a source on every cell; strategy canvas; ERRC; positioning map; win/lose; moves
   COLOUR white / black ink, vermilion #ff4a1c for us, where we trail and top bets, amber for partial; night on #120d0b
   TYPE Sofia Sans Condensed 800 for titles and figures + Sofia Sans for text (both Cyrillic)
   LAYOUT laptop: title + 4 figures, products strip; two-column bands. phone: everything stacks, tables become cards */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#120d0b);--ink:light-dark(#111111,#f4efe9);--mute:light-dark(#5d5a57,#b3aca5);--line:light-dark(#e6e2de,#2e2622);--soft:light-dark(#f6f3f0,#1c1512);--red:light-dark(#ff4a1c,#ff6a43);--amber:light-dark(#d98a00,#f2b23a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Sofia Sans",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
.band{padding-block:clamp(28px,4vw,56px);padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
.wrap{max-width:1240px;margin:0 auto}
h1,h2,.num{font-family:"Sofia Sans Condensed","Arial Narrow",sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0}
h1{font-size:clamp(32px,5vw,52px);text-wrap:balance;max-width:22ch}
h2{font-size:clamp(26px,3vw,34px);text-wrap:balance;margin-bottom:8px}
h3{font-size:17px;margin:0 0 4px}
p{margin:0 0 12px;max-width:68ch}
.lead{font-size:17px;color:var(--mute);margin-top:14px}
.demo{display:inline-block;font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:12px;padding:2px 10px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(10em,1fr));gap:0;margin-top:28px;border-top:2px solid var(--ink)}
.kpi{padding:14px 16px 6px 0}
.kpi .num{font-size:clamp(34px,4.5vw,48px)}
.kpi small{display:block;font-size:13px;color:var(--mute)}
.red{color:var(--red)}
.nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:6px max(5vw,16px)}
.nav a{flex:none;color:var(--ink);text-decoration:none;font-size:14px;padding:10px 12px;border-radius:8px}
.nav a:hover,.nav a:focus-visible{background:var(--soft);outline:none}
.alt{background:var(--soft)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:start;margin-top:18px}
.fig{position:relative;min-height:380px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{paint-order:stroke;stroke:var(--bg);stroke-width:4px;font-family:"Sofia Sans",sans-serif;font-size:13px}
.alt svg text{stroke:var(--soft)}
.ico{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.meter i.low{background:var(--red)}.meter i.mid{background:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{font:inherit;font-size:14px;min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;border-bottom:2px solid var(--ink);padding:8px 8px 6px;vertical-align:bottom}
td{border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.type{font-size:13px;padding:2px 8px;border-radius:4px;white-space:nowrap;border:1px solid var(--ink)}
.type.ex{border-color:var(--red);color:var(--red)}
.ice{display:grid;grid-template-columns:3em minmax(60px,1fr);gap:8px;align-items:center}
tr.top .ice .meter i{background:var(--red)}
tr.top td:first-child{color:var(--red);font-weight:800}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
.card{border-top:4px solid var(--red);background:var(--bg);padding:18px 18px 8px}
.card .num{font-size:40px;color:var(--red)}
.card dl{margin:10px 0 0;font-size:15px}
.card dt{font-size:13px;color:var(--mute)}
.card dd{margin:0 0 10px}
.conf{margin-top:18px}
.conf .row{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 3em;gap:10px;align-items:center}
.conf .meter{height:12px}
.conf b{font-family:"Sofia Sans Condensed",sans-serif;font-size:18px;text-align:right}
details{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
footer{font-size:13px;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:14px;color:var(--mute);margin-top:14px}
@media(max-width:900px){.two{grid-template-columns:minmax(0,1fr)}.cards{grid-template-columns:minmax(0,1fr)}}
.plan{margin-top:20px;border-top:2px solid var(--ink)}
.plan details{margin:0;border-top:0;border-bottom:1px solid var(--line);padding:0}
.plan summary{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;list-style:none}
.plan summary::-webkit-details-marker{display:none}
.plan summary .num{font-size:26px}
.plan summary .ttl{font-weight:700}
.plan summary .ttl small{display:flex;flex-wrap:wrap;gap:6px 12px;font-weight:400;color:var(--mute);font-size:13px;margin-top:2px}
.plan summary .arr{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:transform .2s}
.plan details[open] .arr{transform:rotate(180deg)}
.plan .top .num{color:var(--red)}
.pbody{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:8px 36px;padding:0 0 18px 3.4em}
.pbody h4{font-size:13px;color:var(--mute);font-weight:600;margin:10px 0 4px}
.pbody p,.pbody li{font-size:15px}
.pbody ol,.pbody ul{margin:0;padding-left:1.2em}
.pbody li{margin-bottom:4px}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:15px;margin-top:10px}
.facts dt{color:var(--mute);font-size:13px;padding-top:2px}
.facts dd{margin:0}
.tools{display:flex;justify-content:flex-end;margin-top:-6px}
@media(prefers-reduced-motion:reduce){.plan summary .arr{transition:none}}
@media(max-width:700px){.pbody{grid-template-columns:minmax(0,1fr);padding-left:0}}
.t{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:help;text-decoration:underline dotted color-mix(in srgb,var(--ink) 55%,transparent);text-underline-offset:3px}
.t:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:2px}
#tip{position:fixed;z-index:20;max-width:min(320px,calc(100vw - 32px));background:var(--ink);color:var(--bg);font-size:14px;line-height:1.45;padding:10px 12px;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.18);display:none}
#tip b{display:block;margin-bottom:2px}
.gloss{display:grid;grid-template-columns:minmax(0,12em) minmax(0,1fr);gap:6px 20px;font-size:15px;margin-top:12px}
.gloss dt{font-weight:700}
.gloss dd{margin:0;color:var(--mute)}
.ev{display:inline-block;font-size:12px;line-height:1.3;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap;vertical-align:1px}
.ev.hyp{border-style:dashed}
.answers{display:grid;grid-template-columns:minmax(0,10em) minmax(0,1fr);gap:4px 16px;font-size:15px;margin:6px 0 0}
.answers dt{color:var(--mute);font-size:14px}
.answers dd{margin:0}
.answers dd.skip{color:var(--amber)}
@media(max-width:600px){.gloss{grid-template-columns:minmax(0,1fr)}.gloss dd{margin-bottom:8px}.answers{grid-template-columns:minmax(0,1fr)}.answers dd{margin-bottom:6px}}
.cv{display:block;min-width:0}
/* products strip */
.prods{display:grid;grid-template-columns:repeat(auto-fit,minmax(13em,1fr));gap:0 20px;margin-top:22px}
.prod{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.prod svg{width:44px;height:16px;margin-top:4px}
.prod b{display:block}
.prod small{display:block;color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.prod.us b{color:var(--red)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--red);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:2px}
/* comparison matrix */
.cmp{font-size:14px}
.cmp th.p{min-width:9em}
.cmp th.p.us{color:var(--red)}
.cmp tr.grp th{font-size:13px;color:var(--ink);font-weight:700;border-bottom:1px solid var(--ink);padding-top:18px;background:transparent}
.cmp tr.grp th .tag{font-size:13px}
.cmp td.crit{font-weight:600;min-width:11em}
.cmp td.us{background:color-mix(in srgb,var(--red) 5%,transparent)}
.cmp td.trail{box-shadow:inset 3px 0 0 var(--red)}
.mk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;vertical-align:-5px;margin-right:6px;flex:none}
.mk svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.mk.yes{background:var(--ink);color:var(--bg)}
.mk.part{background:var(--amber);color:#111}
.mk.no{border:1.5px solid var(--mute);color:var(--mute)}
.mk.nd{border:1.5px dashed var(--line);color:var(--mute)}
.ct{color:var(--ink)}
.nd .ct{color:var(--mute)}
.sref{font-size:11px;vertical-align:super;line-height:0;margin-left:2px;color:var(--mute);text-decoration:none;white-space:nowrap}
.sref:hover,.sref:focus-visible{color:var(--red);text-decoration:underline}
.claim{font-style:italic;color:var(--mute);font-size:13px}
.mlegend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mute);margin-top:12px;align-items:center}
.mlegend span{display:inline-flex;align-items:center}
.mlegend .bar{display:inline-block;width:3px;height:18px;background:var(--red);margin-right:8px}
/* canvas & map */
.cvl .lg{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}.cvl svg{width:36px;height:14px}
.keys{columns:2;font-size:14px;color:var(--mute);margin:10px 0 0;padding-left:1.6em}
@media(max-width:600px){.keys{columns:1}}
.errc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-top:2px solid var(--ink);margin-top:18px}
.eb{padding:14px 16px 10px 0;border-bottom:1px solid var(--line)}
.eb:nth-child(odd){border-right:1px solid var(--line)}
.eb:nth-child(even){padding-left:16px}
.eb h3{font-family:"Sofia Sans Condensed",sans-serif;font-weight:800;font-size:22px;margin-bottom:6px}
.eb.raise h3,.eb.create h3{color:var(--red)}
.eb ul{margin:0;padding-left:1.1em;font-size:15px}
.eb li{margin-bottom:8px}
.eb li small{display:block;color:var(--mute);font-size:13px}
.eb a.op{font-size:12px;color:var(--red);text-decoration:none;margin-left:4px;white-space:nowrap}
@media(max-width:600px){.errc{grid-template-columns:minmax(0,1fr)}.eb:nth-child(odd){border-right:0}.eb:nth-child(even){padding-left:0}}
/* win / lose */
.wl h3{font-size:17px}
.wl .side{border-top:4px solid var(--ink);padding-top:12px}
.wl .side.lose{border-color:var(--red)}
.wl .side>h3{font-family:"Sofia Sans Condensed",sans-serif;font-weight:800;font-size:24px;margin-bottom:10px}
.wl .side.lose>h3{color:var(--red)}
.wl article{padding:10px 0;border-bottom:1px solid var(--line)}
.wl article p{font-size:15px;margin:0 0 4px}
.wl article small{color:var(--mute);font-size:13px}
/* sources */
.srcs{margin:14px 0 0;padding-left:2em;font-size:15px}
.srcs li{padding:4px 0;border-bottom:1px solid var(--line);scroll-margin-top:80px}
.srcs li:target{background:color-mix(in srgb,var(--red) 10%,transparent)}
.srcs li small{display:block;color:var(--mute);font-size:13px}
.srcs a{overflow-wrap:anywhere}
.st-ok{color:var(--ink)}.st-demo{color:var(--amber)}.st-no{color:var(--red)}
.stl{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.icef{display:none;font-weight:400;color:var(--mute);font-size:13px}
/* stacked tables on phones */
@media(max-width:600px){
 table{font-size:14px}
 .stack thead{display:none}
 .stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}
 .stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0;align-items:flex-start}
 .stack td::before{content:attr(data-l);color:var(--mute);font-size:13px;flex:none;max-width:40%}
 .stack td .cv{text-align:right}
 .stack td.first .cv{text-align:left;flex:1}
 .stack td.first::before{display:none}
 .cmp td.crit .cv{font-size:16px}
 .cmp td .cv{text-align:left;flex:1}
 .cmp td::before{min-width:7.5em}
 .cmp tr.grp{display:block;border:0;padding:0}
 .cmp tr.grp th{display:block;padding-top:20px}
 .cmp td.trail{box-shadow:none;border-left:3px solid var(--red);padding-left:6px}
 .ev{margin-top:4px}
 .ops td:nth-child(6),.ops td:nth-child(7),.ops td:nth-child(8){display:none}
 .icef{display:inline}
 .ice{width:auto;grid-template-columns:auto minmax(70px,8em)}
 .ice b{white-space:nowrap}
}
</style>
</head>
<body>

<symbol id="a-page" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/></symbol>

<symbol id="m-yes" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>

<header class="band"><div class="wrap">
<span class="demo" data-t="label"></span>
<h1 data-t="headline"></h1>
<p class="lead" data-t="lead"></p>
<div class="kpis" id="kpis"></div>
<div class="prods" id="prods" data-i18n-aria="aProds" aria-label=""></div>
</div></header>

<nav class="nav" data-i18n-aria="aNav" aria-label="">
<a href="#matrix" data-i18n="navMatrix"></a><a href="#canvas" data-i18n="navCanvas"></a><a href="#errc" data-i18n="navErrc"></a><a href="#pmap" data-i18n="navMap"></a><a href="#win" data-i18n="navWin"></a><a href="#moves" data-i18n="navMoves"></a><a href="#next" data-i18n="navNext"></a><a href="#plan" data-i18n="navPlan"></a><a href="#data" data-i18n="navData"></a>
</nav>
<div id="tip" role="tooltip"></div>

<section class="band alt" id="matrix"><div class="wrap">
<h2 data-t="matrixH"></h2>
<p data-t="matrixP"></p>
<div class="chips" role="group" data-i18n-aria="aFilter" aria-label="">
<button class="chip" data-m="all" aria-pressed="true" data-i18n="mAll"></button>
<button class="chip" data-m="diff" aria-pressed="false" data-i18n="mDiff"></button>
<button class="chip" data-m="trail" aria-pressed="false" data-i18n="mTrail"></button>
</div>
<div class="scroll"><table class="stack cmp" id="cmp"><thead id="cmpHead"></thead><tbody id="cmpBody"></tbody></table></div>
<div class="mlegend" id="mlegend"></div>
</div></section>

<section class="band" id="canvas"><div class="wrap">
<h2 data-t="canvasH"></h2>
<p data-t="canvasP"></p>
<div class="fig" id="cv" style="min-height:400px" role="img" data-i18n-aria="aCanvas" aria-label=""></div>
<div class="legend cvl" id="cvLegend"></div>
<ol class="keys" id="cvKeys" hidden></ol>
<p class="lead" style="font-size:14px" id="cvNote"></p>
</div></section>

<section class="band alt"><div class="wrap">
<div class="two" style="margin-top:0">
<div id="errc"><h2 data-t="errcH"></h2><p data-t="errcP"></p><div class="errc" id="errcGrid"></div></div>
<div id="pmap"><h2 data-t="mapH"></h2><p data-t="mapP"></p><div class="fig" id="pm" style="min-height:420px" role="img" data-i18n-aria="aMap" aria-label=""></div><p class="lead" style="font-size:14px" id="pmNote"></p></div>
</div>
</div></section>

<section class="band wl" id="win"><div class="wrap">
<h2 data-t="winH"></h2>
<p data-t="winP"></p>

addEventListener("scroll",()=>{if(tipFor&&Math.abs(scrollY-y0)>40)hideTip()},{passive:true});

/* label placement: nudge labels so they do not overlap (boxes are estimates) */
const place=(items,W,H,B)=>{B=B||{l:2,r:W-2,t:2,b:H-2};const done=[];items.forEach(it=>{const w=it.w,h=16,cands=[[it.x+11,it.y-8],[it.x-11-w,it.y-8],[it.x-w/2,it.y-26],[it.x-w/2,it.y+10],[it.x+11,it.y+8],[it.x-11-w,it.y+8],[it.x+11,it.y-24],[it.x-11-w,it.y-24]];
 let best=cands[0],bs=1e9;cands.forEach(([x,y])=>{let s=0;if(x<B.l||x+w>B.r||y<B.t||y+h>B.b)s+=1000;done.forEach(d=>{const ox=Math.max(0,Math.min(x+w,d.x+d.w)-Math.max(x,d.x)),oy=Math.max(0,Math.min(y+h,d.y+h)-Math.max(y,d.y));s+=ox*oy});items.forEach(p=>{if(p.x>x-6&&p.x<x+w+6&&p.y>y-4&&p.y<y+h+4)s+=60});if(s<bs){bs=s;best=[x,y]}});
 const r={x:best[0],y:best[1],w};done.push(r);it.lx=r.x;it.ly=r.y});return items};
const tw=(s,px=13)=>[...String(s)].length*px*.56;

/* strategy canvas */
const cvEl=document.getElementById("cv"),cvKeys=document.getElementById("cvKeys"),F=(D.canvas||{}).factors||[];
document.getElementById("cvNote").innerHTML=(D.canvas||{}).note||"";
cvKeys.innerHTML=F.map(f=>`<li>${f.k}</li>`).join("");
document.getElementById("cvLegend").innerHTML=ORDER.map(p=>`<span class="lg">${swatch(p)}${p.name}</span>`).join("");
const wrapLab=(s,max)=>{const w=String(s).split(" "),out=[""];w.forEach(x=>{const cur=out[out.length-1];if((cur+" "+x).trim().length>max&&cur)out.push(x);else out[out.length-1]=(cur+" "+x).trim()});return out.slice(0,3)};
const drawCanvas=()=>{const W=cvEl.clientWidth,H=cvEl.clientHeight,N=F.length;if(N<2){cvEl.innerHTML="";return}
 const right=W>=760?130:18,m={l:34,r:right,t:18,b:0};let gap=(W-m.l-m.r)/(N-1);const words=gap>=92,mc=Math.max(10,Math.floor((gap-10)/7.2)),labs=F.map(f=>wrapLab(f.k,mc)),lw=i=>Math.max(...labs[i].map(x=>tw(x)))/2+4;
 if(words){m.l=Math.max(m.l,lw(0));m.r=Math.max(m.r,lw(N-1));gap=(W-m.l-m.r)/(N-1)}m.b=words?70:34;
 const pw=W-m.l-m.r,ph=H-m.t-m.b,X=i=>m.l+i*gap,Y=v=>m.t+ph-v/10*ph;cvKeys.hidden=words;
 let s="";[0,5,10].forEach(v=>{s+=`<line x1="${m.l}" y1="${Y(v)}" x2="${m.l+pw}" y2="${Y(v)}" stroke="var(--line)"${v==5?' stroke-dasharray="4 4"':""}/><text x="${m.l-8}" y="${Y(v)+4}" text-anchor="end" fill="var(--mute)">${v}</text>`});
 F.forEach((f,i)=>{s+=`<line x1="${X(i)}" y1="${m.t}" x2="${X(i)}" y2="${m.t+ph}" stroke="var(--line)"/>`;
  if(words){labs[i].forEach((ln,j)=>{const hw=tw(ln)/2+4,lx=Math.min(Math.max(X(i),hw),W-hw);s+=`<text x="${lx}" y="${m.t+ph+20+j*15}" text-anchor="middle" fill="var(--mute)">${ln}</text>`})}
  else s+=`<text x="${X(i)}" y="${m.t+ph+22}" text-anchor="middle" fill="var(--mute)" font-weight="700">${i+1}</text>`});
 const draw=[...COMP,US],n=draw.length,ends=[];
 draw.forEach((p,k)=>{const st=sty(p),off=(k-(n-1)/2)*2.2,pts=F.map((f,i)=>[X(i),Y(f.levels[p.id]??0)+off]);
  s+=`<polyline points="${pts.map(q=>q.join(",")).join(" ")}" fill="none" stroke="${st.c}" stroke-width="${st.w}" stroke-dasharray="${st.d}" stroke-linejoin="round"/>`;
  pts.forEach(q=>s+=marker(q[0],q[1],st,p===US?4.5:4));ends.push({p,y:pts[N-1][1],c:st.c})});
 if(right>100){ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<15)ends[i].y=ends[i-1].y+15;
  const over=ends.length?ends[ends.length-1].y-(m.t+ph):0;if(over>0)ends.forEach(e=>e.y-=over);
  ends.forEach(e=>s+=`<text x="${m.l+pw+10}" y="${e.y+4}" fill="${e.c}" font-weight="${e.p===US?700:400}">${e.p.name}</text>`)}
 cvEl.innerHTML=`<svg>${s}</svg>`};
new ResizeObserver(drawCanvas).observe(cvEl);

/* positioning map */
const pmEl=document.getElementById("pm"),MP=D.map||{};
document.getElementById("pmNote").innerHTML=MP.note||"";
const drawMap=()=>{const W=pmEl.clientWidth,H=pmEl.clientHeight,m={l:30,r:12,t:30,b:40},pw=W-m.l-m.r,ph=H-m.t-m.b,X=v=>m.l+v/10*pw,Y=v=>m.t+ph-v/10*ph;
 let s=`<rect x="${m.l}" y="${m.t}" width="${pw}" height="${ph}" fill="none" stroke="var(--ink)"/>`;
 s+=`<line x1="${X(5)}" y1="${m.t}" x2="${X(5)}" y2="${m.t+ph}" stroke="var(--mute)" stroke-dasharray="4 4"/><line x1="${m.l}" y1="${Y(5)}" x2="${m.l+pw}" y2="${Y(5)}" stroke="var(--mute)" stroke-dasharray="4 4"/>`;
 const x=MP.x||{},y=MP.y||{};
 s+=`<text x="${m.l}" y="${H-22}" fill="var(--mute)">← ${x.lo||""}</text><text x="${m.l+pw}" y="${H-22}" text-anchor="end" fill="var(--mute)">${x.hi||""} →</text><text x="${m.l+pw/2}" y="${H-4}" text-anchor="middle" fill="var(--ink)" font-weight="700">${x.k||""}</text>`;
 s+=`<text transform="translate(${m.l-10} ${m.t+ph}) rotate(-90)" fill="var(--mute)">← ${y.lo||""}</text><text transform="translate(${m.l-10} ${m.t}) rotate(-90)" text-anchor="end" fill="var(--mute)">${y.hi||""} →</text><text x="${m.l}" y="${m.t-10}" fill="var(--ink)" font-weight="700">↑ ${y.k||""}</text>`;
 const pts=ORDER.map(p=>{const q=(MP.points||{})[p.id]||{x:0,y:0};return{p,x:X(q.x),y:Y(q.y),w:tw(p.name,p===US?14:13)}});
 const grp={};pts.forEach(q=>{const k=Math.round(q.x/6)+"_"+Math.round(q.y/6);(grp[k]=grp[k]||[]).push(q)});Object.values(grp).forEach(g=>{if(g.length>1)g.forEach((q,j)=>{const a=2*Math.PI*j/g.length;q.x+=Math.cos(a)*9;q.y+=Math.sin(a)*9})});
 place([...pts].sort((a,b)=>(b.p===US)-(a.p===US)),W,H,{l:m.l+4,r:m.l+pw-4,t:m.t+2,b:m.t+ph-2});
 pts.forEach(q=>{const st=sty(q.p);s+=marker(q.x,q.y,{...st},q.p===US?7:5.5)});
 pts.forEach(q=>s+=`<text x="${q.lx}" y="${q.ly+12}" fill="${q.p===US?"var(--red)":"var(--ink)"}" font-weight="${q.p===US?800:600}" style="font-size:${q.p===US?14:13}px">${q.p.name}</text>`);
 pmEl.innerHTML=`<svg>${s}</svg>`};
new ResizeObserver(drawMap).observe(pmEl);

/* impact-effort matrix of moves */
const mx=document.getElementById("mx");
const drawMx=()=>{const W=mx.clientWidth,H=mx.clientHeight,m={l:48,r:16,t:16,b:44},pw=W-m.l-m.r,ph=H-m.t-m.b;
 const X=e=>m.l+(e-.5)/10*pw,Y=i=>m.t+ph-(i-.5)/10*ph,midX=X(5.5),midY=Y(5.5);
 let s=`<rect x="${m.l}" y="${m.t}" width="${midX-m.l}" height="${midY-m.t}" fill="var(--red)" fill-opacity=".08"/>`;
 s+=`<line x1="${midX}" y1="${m.t}" x2="${midX}" y2="${m.t+ph}" stroke="var(--mute)" stroke-dasharray="4 4"/><line x1="${m.l}" y1="${midY}" x2="${m.l+pw}" y2="${midY}" stroke="var(--mute)" stroke-dasharray="4 4"/>`;
 s+=`<line x1="${m.l}" y1="${m.t+ph}" x2="${m.l+pw}" y2="${m.t+ph}" stroke="var(--ink)"/><line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${m.t+ph}" stroke="var(--ink)"/>`;
 [[L.qWin,m.l+8,m.t+18,"start","var(--red)"],[L.qBig,m.l+pw-8,m.t+18,"end","var(--mute)"],[L.qSmall,m.l+8,m.t+ph-10,"start","var(--mute)"],[L.qPit,m.l+pw-8,m.t+ph-10,"end","var(--mute)"]].forEach(a=>s+=`<text x="${a[1]}" y="${a[2]}" text-anchor="${a[3]}" fill="${a[4]}" font-weight="700">${a[0]}</text>`);
 s+=`<text x="${m.l+pw/2}" y="${H-10}" text-anchor="middle" fill="var(--mute)">${L.axE}</text><text transform="translate(16 ${m.t+ph/2}) rotate(-90)" text-anchor="middle" fill="var(--mute)">${L.axI}</text>`;
 const r=W<520?11:14,grp={};ops.forEach(o=>(grp[o.eff+"_"+o.I]=grp[o.eff+"_"+o.I]||[]).push(o.id));
 ops.forEach(o=>{const g=grp[o.eff+"_"+o.I],j=g.indexOf(o.id),a=g.length>1?2*Math.PI*j/g.length-Math.PI/2:0,sp=g.length>1?r*1.15:0,x=X(o.eff)+Math.cos(a)*sp,y=Y(o.I)+Math.sin(a)*sp,ex=o.x=="ex",hot=top3.includes(o.id);
  s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="${ex?"var(--bg)":hot?"var(--red)":"var(--ink)"}" stroke="${ex?"var(--red)":"none"}" stroke-width="2.5"/><text x="${x}" y="${y+4.5}" text-anchor="middle" fill="${ex?"var(--red)":"var(--bg)"}" style="stroke:none" font-weight="700">${o.id}</text>`});
 mx.innerHTML=`<svg>${s}</svg>`};
new ResizeObserver(drawMx).observe(mx);
}
</script>
